services:
  - type: web
    name: tunan-home
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt && cd frontend && npm install && npm run build && cd .. && python manage.py collectstatic --noinput
    startCommand: gunicorn mysite.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_ENGINE
        value: sqlite